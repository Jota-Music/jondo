[package]
name = "jondo"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A minimal, native music player for Spotify browsing and YouTube playback"

[lib]
name = "jondo"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "jondo"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9"
# No direct use in this crate: it turns on rust-embed's `debug-embed`, which the
# icon bundle inherits through feature unification. Without it the bundle reads
# the SVGs from disk in debug builds, and an Android debug build has no crate
# directory to read them from.
rust-embed = { version = "8", default-features = false, features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
url = "2"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
aes-gcm = "0.11"
pbkdf2 = "0.12"
base64 = "0.22"
open = "5"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "gzip",
    "http2",
    "json",
    "rustls-tls-native-roots",
    "stream",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
raw-window-handle = "0.6"

librespot-core = { version = "0.8", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
librespot-protocol = "0.8"
protobuf = "3"

symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "isomp4",
    "opt-simd",
] }
cpal = "0.18"

# Chromium's cookie jar: the cipher differs per desktop, the reader does not.
[target.'cfg(all(any(unix, windows), not(target_os = "android")))'.dependencies]
aes = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# The pin drives an X11 EWMH message, so the client is only needed where that
# protocol exists. macOS is unix too, and pulling x11rb there bought nothing.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# The portal is the blocking dialog on a Linux desktop; the macOS and Windows
# builds use their own native dialog and must not pull a unix-only backend.
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[target.'cfg(all(not(target_os = "android"), not(target_os = "linux")))'.dependencies]
rfd = { version = "0.15", default-features = false }

# Desktop media keys and the OS now-playing panel: MPRIS on Linux, SMTC on
# Windows and Now Playing on macOS. Android drives its own session through
# gpui-mobile instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
souvlaki = "0.9"

# Souvlaki needs the window handle on Windows to own the SMTC transport.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", path = "vendor/gpui-mobile", default-features = false, features = [
    "path_provider",
    "media_session",
    "deeplink",
    "clipboard",
] }
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
# gpui-mobile talks to the JVM through jni 0.22, and its helpers hand back values
# of that version. The login hold goes through those helpers, so it needs the
# same crate; the alias keeps 0.21 available for the rest of the app.
jni22 = { package = "jni", version = "0.22" }
ndk-context = "0.1"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
librespot-core = { path = "vendor/librespot-core" }

[dev-dependencies]
# The headless window, event dispatch and selector queries the UI tests drive
# the app through. Test only: the shipped binary keeps the no-op selector path.
gpui_pre = { version = "=0.3.11", package = "gpui-pre", features = ["test-support"] }

[profile.dev]
opt-level = 1
# Off because rustc 1.99 + rust-lld drops the hidden symbols incremental
# compilation internalizes (`anon.…llvm.…`, `drop_glue::<…>`) and the binary
# stops linking. It links for a while and then fails after a few edits, so it
# is not a build that can be trusted. On: the crate rebuilds in 3s instead of
# 24s.
incremental = false
# Line tables only: the debug library is otherwise a quarter of a gigabyte and
# every install pays for it.
debug = 1

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Size first: the UI waits on the network and the disk, not on the processor,
# and a binary at opt-level 2 carries three times the code of one at "z" — the
# generic instantiations of the UI framework unfold into every caller.
#
# The packages below keep the full optimization: the ones that lay out, shape
# text, paint and decode audio. Everything else is compiled for size, because
# nothing else runs while a frame paints. `tests/build.rs` fails if one of
# those packages drops to size.
opt-level = "z"

[profile.release.package.gpui-base]
opt-level = 3

[profile.release.package.gpui-component]
opt-level = 3

[profile.release.package.gpui-kit-assets]
opt-level = 3

[profile.release.package.gpui-pre]
opt-level = 3

[profile.release.package.gpui-pre-linux]
opt-level = 3

[profile.release.package.gpui-pre-platform]
opt-level = 3

[profile.release.package.gpui-pre-wgpu]
opt-level = 3

[profile.release.package.taffy]
opt-level = 3

[profile.release.package.cosmic-text]
opt-level = 3

[profile.release.package.swash]
opt-level = 3

[profile.release.package.rustybuzz]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.skrifa]
opt-level = 3

[profile.release.package.wgpu]
opt-level = 3

[profile.release.package.wgpu-core]
opt-level = 3

[profile.release.package.wgpu-hal]
opt-level = 3

[profile.release.package.wgpu-types]
opt-level = 3

[profile.release.package.naga]
opt-level = 3

[profile.release.package.lyon]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.usvg]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.moxcms]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.symphonia-core]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.symphonia-format-isomp4]
opt-level = 3

[profile.release.package.cpal]
opt-level = 3

# A release build without the fat-LTO cost, for smoke-testing the optimized
# binary while iterating. Distribution keeps using `--release`.
[profile.quick]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[profile.dev.package."*"]
opt-level = 2
debug = false
